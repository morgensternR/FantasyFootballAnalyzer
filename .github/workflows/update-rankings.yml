# Keeps draft rankings, auction values, projected volume, and snap context fresh.
# Fetches FantasyPros, ESPN, Sleeper, Yahoo, and the volume/snap sources,
# rebuilds the bundled data, and redeploys when the data actually changed.

name: Update rankings

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: deploy-pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch latest rankings
        run: npm run fetch:rankings

      - name: Rebuild draft pool
        run: npm run build:draft-data

      # Must run after build:draft-data because volume-source rows join to the
      # stable player ids in the freshly rebuilt pool. Projection sources are
      # best-effort individually; the script refuses to replace good volume
      # data when every projection source is unavailable.
      - name: Refresh volume projections and snap context
        run: npm run update:volume

      - name: Detect real changes (ignore fetch timestamps)
        id: diff
        run: |
          if git diff --quiet -I '"(generatedAt|fetchedAt)"' -- data/raw src/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- .
            echo "No ranking/volume changes since last run."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Surface salary drift
        if: steps.diff.outputs.changed == 'true'
        run: |
          file=$(ls data/raw/misses.*.json 2>/dev/null | head -1 || true)
          if [ -n "$file" ]; then
            misses=$(node -e "const s=(require('./'+process.argv[1]).Salary||[]); if (s.length) console.log(s.join('\n'))" "$file" 2>/dev/null || true)
            if [ -n "$misses" ]; then
              echo "::warning title=Salary sheet drift::Some salary rows did not match current rankings; see the job summary to mend them."
              {
                echo "### Salary sheet drift (non-fatal)"
                echo "These rows in data/salary_cap_values.csv did not match current rankings and were skipped (their value still comes from the position curve). Mend the names:"
                echo '```'
                echo "$misses"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Run tests
        if: steps.diff.outputs.changed == 'true'
        run: npm run test:run

      - name: Build site
        if: steps.diff.outputs.changed == 'true'
        run: npm run build

      - name: Commit updated data
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/raw src/data
          git commit -m "Update draft rankings and volume data"
          git pull --rebase origin master
          git push

      - name: Rebuild rebased tree for deploy
        if: steps.diff.outputs.changed == 'true'
        run: npm run build
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}

      - name: Deploy to GitHub Pages
        if: steps.diff.outputs.changed == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

      - name: Report failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Update rankings workflow failed"
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ($(date -u +%F))"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
