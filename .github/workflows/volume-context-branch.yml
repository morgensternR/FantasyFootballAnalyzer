name: Volume context branch gate

on:
  push:
    branches: [draft-risk-dashboard]
    paths:
      - 'scripts/updateVolumeContext.ts'
      - 'src/utils/volumeContext.ts'
      - 'src/utils/volumeContext.test.ts'
      - 'src/utils/draftVolumeOverlay.ts'
      - 'src/utils/draftPickClock.ts'
      - 'src/draftBoardInteractions.css'
      - 'src/data/volumeContext*.json'
      - 'src/data/volumeContext.ts'
      - 'package.json'
      - '.github/workflows/volume-context-branch.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: volume-context-branch
  cancel-in-progress: true

jobs:
  volume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Refresh projected volume and previous-season snaps
        run: npm run update:volume

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # The GITHUB_TOKEN push does not recursively trigger workflows, so this
      # safely materializes the generated data once after source-code changes.
      - name: Commit generated volume context
        run: |
          if git diff --quiet -- src/data/volumeContext.*; then
            echo "Volume context already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/volumeContext.*
          git commit -m "Update 2026 volume context"
          git push
